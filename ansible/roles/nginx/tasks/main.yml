# Rôle nginx : installe le serveur web et configure le site.

- name: Installer nginx
  ansible.builtin.apt:
    name: "{{ nginx_packages }}"
    state: present

- name: Démarrer nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Supprimer le site par défaut
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: nginx config modifiée

- name: Créer la configuration du site
  ansible.builtin.template:
    src: fleetinfo.conf.j2
    dest: "{{ nginx_site_available }}"
    owner: root
    group: root
    mode: "0644"
  notify: nginx config modifiée

- name: Activer le site
  ansible.builtin.file:
    src: "{{ nginx_site_available }}"
    dest: "{{ nginx_site_enabled }}"
    state: link
  notify: nginx config modifiée

# Pas besoin de recharger nginx : il relit ce fichier à chaque requête.
- name: Créer le mot de passe de /status
  community.general.htpasswd:
    path: "{{ nginx_htpasswd_file }}"
    name: "{{ nginx_status_user }}"
    password: "{{ nginx_status_password }}"
    owner: root
    group: www-data
    mode: "0640"
  no_log: true

# On applique la config tout de suite, car fleetinfo teste le site juste après.
- name: Appliquer les changements de nginx maintenant
  ansible.builtin.meta: flush_handlers
