# Configuration d'Ansible pour le projet.
[defaults]
# Par défaut on travaille en local. Pour le cloud : -i inventories/cloud/fleet.gcp.yml
inventory = inventories/local
roles_path = roles
vault_password_file = .vault_pass
# Texte mis en haut de chaque fichier généré par un template.
ansible_managed = Fichier géré par Ansible (Socle Web Automatisé) - toute modification manuelle sera écrasée
interpreter_python = auto_silent
result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
